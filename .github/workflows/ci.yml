name: CI

on:
  push:
    branches: ["**"] # All branches (you can also remove this section for all pushes)
  pull_request:
    branches: [main] # PRs targeting main

jobs:
  test:
    runs-on: ubuntu-latest
    #runs-on: [self-hosted, linux]

    steps:
      - uses: actions/checkout@v4

      - name: Check for leaks in the code
        run: |
          set -e
          sudo apt-get update
          sudo apt-get install -y gitleaks
          gitleaks detect --source $GITHUB_WORKSPACE --log-opts="-p -n 1"

      - name: check supply chain attacks
        run: |
          curl -sSfL https://raw.githubusercontent.com/anchore/syft/main/install.sh | sudo sh -s -- -b /usr/local/bin
          curl -sSfL https://raw.githubusercontent.com/anchore/grype/main/install.sh | sudo sh -s -- -b /usr/local/bin
          echo "Creating SBOM..."
          syft scan . --output cyclonedx-json@1.5=sbom.cdx.json
          echo "Running vulnerability scan..."
          grype sbom.cdx.json

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: "1.26.3"

      - name: Cache Go modules
        uses: actions/cache@v4
        with:
          path: ~/.cache/go-build
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Install dependencies
        run: go mod download

      - name: Generate protobuf code (debug)
        run: |
          # Debug: show repo root and proto dir contents
          echo "PWD: $(pwd)"
          echo "Listing repo root:"
          ls -la
          echo "Listing proto dir if exists:"
          ls -la proto || true
          echo "Finding proto files:"
          find proto -name '*.proto' -print || true

          # Install protoc compiler
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler
          # Ensure GOPATH/bin is in PATH so installed protoc-gen-* are discoverable
          export PATH="$PATH:$(go env GOPATH)/bin"
          # Install codegen plugins and generate code via Makefile target
          make proto

      - name: Run tests
        run: go test -v ./...

  build_artifacts:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: linux
            arch: amd64
          - os: darwin
            arch: arm64
    continue-on-error: false
    steps:
      - uses: actions/checkout@v4

      - name: Load .env variables
        run: |
          export $(cat ~/actions-runner/.env | xargs)
          env

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: "1.26.3"

      - name: Install protoc
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler

      - name: Ensure protoc-gen plugins
        run: |
          export PATH="$PATH:$(go env GOPATH)/bin"
          make install-proto-tools

      - name: Generate proto files
        run: make proto

      - name: Build binaries
        run: |
          GOOS=${{ matrix.os }}
          GOARCH=${{ matrix.arch }}
          DIST=dist/${{ matrix.os }}/${{ matrix.arch }}

          echo "Building for $GOOS/$GOARCH to be stored in $DIST/"
          mkdir -p $DIST
          # disable cgo for cross-compilation
          export CGO_ENABLED=0
          # set output names (windows needs .exe)
          if [ "$GOOS" = "windows" ]; then
            srv=$DIST/merkle-server.exe
            cli=$DIST/merkle-client.exe
            chk=$DIST/merkle-checker.exe
            ben=$DIST/merkle-bench.exe
          else
            srv=$DIST/merkle-server
            cli=$DIST/merkle-client
            chk=$DIST/merkle-checker
            ben=$DIST/merkle-bench
          fi

          echo "→ Building server..."
          GOOS=$GOOS GOARCH=$GOARCH go build -o "$srv" ./cmd/server

          echo "→ Building client..."
          GOOS=$GOOS GOARCH=$GOARCH go build -o "$cli" ./cmd/client

          echo "→ Building checker..."
          GOOS=$GOOS GOARCH=$GOARCH go build -o "$chk" ./cmd/checker

          echo "→ Building bench..."
          GOOS=$GOOS GOARCH=$GOARCH go build -o "$ben" ./cmd/bench

          # Optional: list what actually got built
          echo "Built files in $DIST:"
          ls -l "$DIST/" || echo "DIST directory is empty!"

      - name: Package artifacts
        run: |
          mkdir -p out
          # Re-define DIST here so it's reliable
          DIST="dist/${{ matrix.os }}/${{ matrix.arch }}"
          tarfile="out/merkle-${{ matrix.os }}-${{ matrix.arch }}.tar.gz"
          tar_sbom="out/merkle-sbom-${{ matrix.os }}-${{ matrix.arch }}.tar.gz"

          echo "=== Packaging ==="
          echo "DIST directory = $DIST"
          echo "Contents:"
          ls -la "$DIST" || echo "Directory $DIST does NOT exist!"

          if [ ! -d "$DIST" ] || [ -z "$(ls -A "$DIST")" ]; then
            echo "ERROR: DIST directory is missing or empty!"
            exit 1
          fi

          echo "Creating binary archive: $tarfile"
          tar -czf "$tarfile" -C "$DIST" .

          echo "Creating SBOM archive: $tar_sbom"
          tar -czf "$tar_sbom" sbom.cdx.json

          echo "✅ Successfully created archives:"
          ls -lh "$tarfile" "$tar_sbom"

      - name: Store artifacts in Artifactory
        if: github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail

          pass=$(curl --fail -s -H "X-Vault-Token: ${{ secrets.VAULT_TOKEN }}" "${{ vars.VAULT_ADDR }}/v1/kv/data/prod/artifactory/ci" | jq -r '.data.data.password')
          iso=$(date +%Y%m%d%H%M)

          # Upload Binary Tarball
          FILE="out/merkle-${{ matrix.os }}-${{ matrix.arch }}.tar.gz"
          MD5=$(md5sum "$FILE" | awk '{print $1}')
          SHA1=$(sha1sum "$FILE" | awk '{print $1}')
          echo "Uploading $FILE (MD5: $MD5, SHA1: $SHA1)"
          curl --fail-with-body -s -u "ci:$pass" -X PUT -T "$FILE" \
            -H "X-Checksum-Md5: $MD5" -H "X-Checksum-Sha1: $SHA1" \
            "https://stratos01.phonax.com/artifactory/internal_test/merkel/$GITHUB_SHA/merkle-${{ matrix.os }}-${{ matrix.arch }}-$iso.tar.gz"

          # Upload SBOM Tarball!
          SBOM="out/merkle-sbom-${{ matrix.os }}-${{ matrix.arch }}.tar.gz"
          MD5_S=$(md5sum "$SBOM" | awk '{print $1}')
          SHA1_S=$(sha1sum "$SBOM" | awk '{print $1}')
          echo "Uploading $SBOM (MD5: $MD5_S, SHA1: $SHA1_S)"
          curl --fail-with-body -s -u "ci:$pass" -X PUT -T "$SBOM" \
            -H "X-Checksum-Md5: $MD5_S" -H "X-Checksum-Sha1: $SHA1_S" \
            "https://stratos01.phonax.com/artifactory/internal_test/merkel/$GITHUB_SHA/merkle-sbom-${{ matrix.os }}-${{ matrix.arch }}-$iso.tar.gz"
